name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Record toolchain versions
        shell: pwsh
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productDisplayVersion

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Read version from CMake (single source of truth)
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path CMakeLists.txt -Pattern 'project \(VoxLift VERSION ([0-9.]+)'
          "value=$($line.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: pluginval (strictness 10, no GUI tests)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 10 --skip-gui-tests --validate-in-process --output-dir pluginval-logs "build\VoxLift_artefacts\Release\VST3\VoxLift.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          iscc /DAppVersion=${{ steps.version.outputs.value }} installer\VoxLift.iss

      - uses: actions/upload-artifact@v7
        with:
          name: VoxLift-Setup-windows
          path: dist/*.exe

      - uses: actions/upload-artifact@v7
        with:
          name: VoxLift-VST3-windows
          path: build/VoxLift_artefacts/Release/VST3/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pluginval-logs
          path: pluginval-logs/
